services:
  # ============================================================================
  # Infrastructure: PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: learnova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-learnova_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-learnova_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - learnova-network

  # ============================================================================
  # Infrastructure: Redis Cache & Event Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: learnova-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - learnova-network

  # ============================================================================
  # Backend API Service (Optional containerized profile)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnova-backend
    restart: unless-stopped
    profiles: ["app-full"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-learnova_db}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-learnova_db}
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8001/api/v1
      ML_SERVICE_URL: http://ml-service:8002/api/v1
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learnova-network

  # ============================================================================
  # AI Service (Optional containerized profile)
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: learnova-ai-service
    restart: unless-stopped
    profiles: ["app-full"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - learnova-network

  # ============================================================================
  # ML Service (Optional containerized profile)
  # ============================================================================
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: learnova-ml-service
    restart: unless-stopped
    profiles: ["app-full"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-learnova_db}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${ML_SERVICE_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models_data:/app/app/models/registry
    networks:
      - learnova-network

  # ============================================================================
  # Frontend Application (Optional containerized profile)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnova-frontend
    restart: unless-stopped
    profiles: ["app-full"]
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - backend
    networks:
      - learnova-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ml_models_data:
    driver: local

networks:
  learnova-network:
    driver: bridge
