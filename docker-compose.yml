services:
  # ============================================================================
  # Infrastructure: PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: excelr-learnova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-learnova_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-learnova_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - learnova-network

  # ============================================================================
  # Infrastructure: Redis Cache & Event Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: excelr-learnova-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - learnova-network

  # ============================================================================
  # ExcelR Learnova Backend API Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: excelr-learnova-backend
    restart: unless-stopped
    profiles: ["app-full"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-learnova_db}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-learnova_db}
      REDIS_URL: redis://redis:6379/0
      TRACK360_BASE_URL: ${TRACK360_BASE_URL:-http://host.docker.internal:8000}
      TRACK360_SERVICE_EMAIL: ${TRACK360_SERVICE_EMAIL:-admin@excelr.com}
      TRACK360_SERVICE_PASSWORD: ${TRACK360_SERVICE_PASSWORD:-Admin@Track360_2026!}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learnova-network

  # ============================================================================
  # ExcelR Learnova Frontend Application
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: excelr-learnova-frontend
    restart: unless-stopped
    profiles: ["app-full"]
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - backend
    networks:
      - learnova-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  learnova-network:
    driver: bridge
